# Railway (railway.com) config-as-code — build the DV image and run the gate.
# https://docs.railway.com/reference/config-as-code
#
# This project is a hardware DV suite, not a web service: it has no listening
# port.  The container runs `make ci` (the full lint + eda-check + cocotb + SV + pack + act
# + reorder + ooo + mrp + sva-mut + SystemC + coverage + formal gate) and exits with the gate's
# status (0 = green).  Deploy it as a run-to-completion job, not an
# always-on service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Deploy (= run the gate) only when one of these changes on main.  Railway reads the patterns from main.
watchPatterns = [
  "rtl/**", "dv/**", "uvm/**", "formal/**", "sim/**", "eda/**", "tools/**", "metrics/**",
  "docker/**", "Dockerfile", "Makefile", "swarm.mk", "railway.toml", ".claude/swarm.env",
]

[deploy]
# Batch job: don't restart on exit.  (A normal always-on service that exits 0
# is flagged "crashed" by Railway — NEVER is correct for a run-to-completion
# gate.)
restartPolicyType = "NEVER"

# Do NOT set startCommand: the image's ENTRYPOINT (docker/entrypoint.sh) runs
# `make ci`.  A Railway startCommand is run via `sh -c`, which bypasses that
# wrapper (its log-volume filter, agent/swarm and metrics modes).

# No schedule (removed 2026-11-12): the gate runs only when asked - the Redeploy button in Railway - or when a
# push to main changes something that can change its result (watchPatterns below).  Docs-only pushes do not
# start a run.  To schedule it again, add e.g. `cronSchedule = "17 3 * * 0"` (UTC) here.
