name: CI

# The toolchain (Verilator + Yosys/slang + SBY + btormc built from source; Icarus,
# SystemC from apt; cocotb/pyuvm from pip) is defined once, in the Dockerfile.  A
# `build-image` job builds its `tools` target into a GHCR image keyed by the
# Dockerfile hash (so it is rebuilt only when the toolchain changes), and the gate
# runs inside it via `container:`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: |
          set -euo pipefail
          tag="tools-$(sha256sum Dockerfile | cut -c1-12)"
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo}/dv-tools:${tag}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build + push the toolchain image if it is not already cached
        run: |
          set -euo pipefail
          img="${{ steps.meta.outputs.image }}"
          if docker manifest inspect "$img" >/dev/null 2>&1; then
            echo "reusing cached toolchain image: $img"
          else
            echo "building toolchain image: $img"
            docker build --target tools -t "$img" .
            docker push "$img"
          fi

  ci:
    needs: build-image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # cocotb's VPI is built against the apt iverilog at /usr/bin.
      env:
        ICARUS_BIN_DIR: /usr/bin
    steps:
      - uses: actions/checkout@v7

      - name: Tool versions
        run: |
          iverilog -V | head -1
          verilator --version
          sby --help | head -1
          python -c "import cocotb, pyuvm; print('cocotb', cocotb.__version__, 'pyuvm', pyuvm.__version__)"

      # lint + PyUVM/cocotb regression + SV directed TB (Icarus & Verilator, with
      # bound SVA) + SystemC + Verilator coverage + SymbiYosys formal, as one
      # pass/fail gate.  The SV/UVM flow (make uvm) is not run here: it needs a
      # UVM-capable simulator, so it would only skip.
      - name: make ci
        run: make ci

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-info
          path: sim/coverage.info
          if-no-files-found: ignore
