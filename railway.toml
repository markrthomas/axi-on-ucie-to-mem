# Railway (railway.com) config-as-code — build the DV image and run the gate.
# https://docs.railway.com/reference/config-as-code
#
# This project is a hardware DV suite, not a web service: it has no listening
# port.  The container runs `make ci` (the full lint + cocotb + SV + pack + act
# + reorder + ooo + SystemC + coverage gate) and exits with the gate's status
# (0 = green).  Deploy it as a one-off / scheduled job, not an always-on service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Batch job: don't restart on exit.  (A normal always-on service that exits 0
# is flagged "crashed" by Railway — NEVER is correct for a run-to-completion
# gate.)
restartPolicyType = "NEVER"

# Do NOT set startCommand: the image's ENTRYPOINT (docker/entrypoint.sh) runs
# `make ci` with the pinned Verilator args injected.  A Railway startCommand is
# run via `sh -c`, which bypasses that wrapper and drops the overrides.

# Run the gate on a schedule.  Railway cron is UTC and starts a fresh container
# per tick; the container must exit before the next tick — which this gate does.
#
# 2:00 AM MST (Mountain Standard, UTC-7) = 09:00 UTC.
# NOTE: Railway cron is fixed UTC and does NOT follow US daylight saving, so from
# mid-Mar to early-Nov (MDT, UTC-6) 09:00 UTC lands at 3:00 AM local.  For 2:00 AM
# *local year-round* you'd need to switch this to "0 8 * * *" during MDT.
cronSchedule = "0 9 * * *"   # daily at 09:00 UTC = 02:00 MST
