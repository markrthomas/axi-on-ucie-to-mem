name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # 24.04 ships Verilator 5.x (needed for --binary/--timing and --sc) and
    # SystemC 2.3.3, so the full regression runs for real here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install RTL tools (Icarus + Verilator + SystemC)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            iverilog verilator libsystemc-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps (cocotb + pyuvm)
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'cocotb==1.9.2' 'pyuvm==4.0.1'

      - name: Tool versions
        run: |
          iverilog -V | head -1
          verilator --version
          python -c "import cocotb, pyuvm; print('cocotb', cocotb.__version__, 'pyuvm', pyuvm.__version__)"

      # lint + PyUVM/cocotb regression + SV directed TB (Icarus & Verilator, with
      # bound SVA) + SystemC + Verilator coverage, as one pass/fail gate.  The
      # SV/UVM flow (make uvm) is not run here: GitHub runners have no UVM-capable
      # simulator, so it would only skip.
      - name: make ci
        run: make ci
        env:
          # cocotb runs under the setup-python interpreter; iverilog+vvp are the
          # apt pair, so ICARUS_BIN_DIR points at the system bin.
          ICARUS_BIN_DIR: /usr/bin

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-info
          path: sim/coverage.info
          if-no-files-found: ignore
