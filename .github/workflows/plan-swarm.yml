name: Plan swarm

# Plan-driven autonomous DV swarm.
#
# You (with your planning session) write docs/SWARM_PLAN.md, set `status: ready`
# in its front-matter, and push it to `main`.  This workflow then runs the DV
# swarm, which IMPLEMENTS the plan, gets `make regress` green, and opens a PR.
# The swarm never commits to main — a human reviews and merges.  See
# docs/DOCKER.md -> "Plan-driven swarm".
#
# Triggers:
#   * push to main that changes docs/SWARM_PLAN.md AND has `status: ready`
#   * manual "Run workflow" (runs regardless of status)
#
# Secrets:
#   ANTHROPIC_API_KEY   (provider=anthropic)  Claude Console API key (sk-ant-api…), OR
#   CLAUDE_CODE_OAUTH_TOKEN  (provider=anthropic)  subscription token (sk-ant-oat…,
#                       from `claude setup-token`) — set one of these two.
#   KIMI_API_KEY        (provider=kimi)        Moonshot key for Kimi K3.
#   SWARM_GITHUB_TOKEN  (optional) contents:write + pull-requests:write; falls
#                       back to the built-in GITHUB_TOKEN (its PRs don't re-run CI).
on:
  push:
    branches: [main]
    paths: ["docs/SWARM_PLAN.md"]
  workflow_dispatch:
    inputs:
      provider:
        description: "Model provider for the run"
        required: false
        default: "anthropic"
        type: choice
        options:
          - anthropic
          - kimi

permissions:
  contents: write
  pull-requests: write

# Share the swarm serialization group so a plan run and a manual DV swarm never
# run at the same time.
concurrency:
  group: dv-swarm
  cancel-in-progress: false

jobs:
  # Toolchain image (Dockerfile `tools` target), keyed by the Dockerfile hash and
  # cached in GHCR — same image the CI gate runs in (see ci.yml).
  build-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: |
          set -euo pipefail
          tag="tools-$(sha256sum Dockerfile | cut -c1-12)"
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo}/dv-tools:${tag}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build + push the toolchain image if it is not already cached
        run: |
          set -euo pipefail
          img="${{ steps.meta.outputs.image }}"
          if docker manifest inspect "$img" >/dev/null 2>&1; then
            echo "reusing cached toolchain image: $img"
          else
            docker build --target tools -t "$img" .
            docker push "$img"
          fi

  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — running the plan swarm." >> "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if head -n 20 docs/SWARM_PLAN.md | grep -qiE '^status:[[:space:]]*ready'; then
            echo "docs/SWARM_PLAN.md is 'status: ready' — running the plan swarm." >> "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs/SWARM_PLAN.md is not 'status: ready' — skipping (set status: ready to arm)." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  swarm:
    needs: [gate, build-image]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    env:
      ICARUS_BIN_DIR: /usr/bin
      VL_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # full history so the manager can branch/commit cleanly

      # gh (the swarm opens its PR with it); git/make/the DV toolchain come from the image.
      - name: Install GitHub CLI
        run: apt-get update && apt-get install -y --no-install-recommends gh

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Tool versions
        run: |
          iverilog -V | head -1
          verilator --version
          node --version
          claude --version
          gh --version | head -1

      - name: Run the plan swarm
        env:
          AOU_MODEL_PROVIDER: ${{ github.event.inputs.provider || 'anthropic' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.SWARM_GITHUB_TOKEN || github.token }}
          # Author the swarm's commits as the triggering user (the repo owner) via
          # a GitHub noreply address, so GitHub doesn't hold the branch's CI as
          # `action_required` (which it does for commits by a non-collaborator
          # identity like a bot).
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          AOU_METRICS_JSON: ${{ github.workspace }}/last-run-metrics.json
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: bash docker/swarm.sh "$(cat docker/swarm-plan-task.md)"

      - name: Publish run metrics
        if: always()
        env:
          AOU_MODEL_PROVIDER: ${{ github.event.inputs.provider || 'anthropic' }}
        run: |
          f="${{ github.workspace }}/last-run-metrics.json"
          if [ -f "$f" ]; then
            {
              echo "### Plan swarm run metrics (provider: ${AOU_MODEL_PROVIDER:-anthropic})"
              echo '```'
              python3 docker/render-metrics.py --result-file "$f" --provider "${AOU_MODEL_PROVIDER:-anthropic}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No metrics file was produced (the run may have failed before a result)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload run metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plan-swarm-metrics
          path: ${{ github.workspace }}/last-run-metrics.json
          if-no-files-found: ignore
